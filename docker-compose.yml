version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tt-app-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn app.main:tt_web_app_rc --host 0.0.0.0 --port 8000 --reload
    networks:
      - tt-app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tt-app-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:8000
    command: npm run dev
    networks:
      - tt-app-network
    depends_on:
      - backend

networks:
  tt-app-network:
    driver: bridge
