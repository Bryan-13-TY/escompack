services:
  mongodb:
    # usamos la imagen oficial de MongoDB en vez de crear una propia 
    image: mongo:4.4
    container_name: ESCOMPack-mongodb
    # mapea el puerto 27017 local al 27017 del contenedor
    ports:
      - "27017:27017"
    # mapea el volumen local mongodb_data al contenedor
    # para persistir los datos de la base de datos
    volumes:
      - mongo_data:/data/db
    networks:
      - ESCOMPack-network
    
  backend:
    # busca las instrucciones en la carpeta ./backend
    # usando su Dockerfile
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ESCOMPack-backend
    # el contenedor tiene acceso directo a todas las
    # interfaces de red de la VM
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # mapea el código local al contenedor
    # esto permite edición en tiempo real
    volumes:
      - ./backend:/app
    # evita que Python guarde en búfer las salidas de texto
    # haciendo que los print() y logs aparezcan de inmediato
    # en la terminal
    environment:
      - PYTHONUNBUFFERED=1
    command: uvicorn app.main:escom_pack --host 0.0.0.0 --port 8000 --reload
    # asegura que Docker intente iniciar MongoDB antes que el backend
    depends_on:
      - mongodb

  frontend:
    # busca las instrucciones en la carpeta ./frontend
    # usando su Dockerfile
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ESCOMPack-frontend
    # mapea el puerto 5173 local al 5173 del contenedor
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app # soporte de recarga en vivo
      - /app/node_modules # evita que se sobreescriba
    command: npm run dev
    networks:
      - ESCOMPack-network
    # asegura que Docker inicie primero el contenedor del
    # backend entes de levantar el frontend
    depends_on:
      - backend

networks:
  ESCOMPack-network:
    driver: bridge

volumes:
  mongo_data:
